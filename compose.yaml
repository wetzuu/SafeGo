services:
  database:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: safego
      POSTGRES_USER: safego
      POSTGRES_PASSWORD: safego_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - safego_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safego -d safego"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  safego_postgres_data:
